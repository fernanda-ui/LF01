<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iris - Assistant</title>
  <link rel="icon" type="image/x-icon" href="/static/irisicon.png" />
  <link rel="stylesheet" href="/static/css/landing.css" />
  <script defer type="module" src="/static/js/landing.js"></script>
</head>

<body>
  <section class="hero" id="hero">
    <video src="/static/video.mp4" autoplay muted loop></video>

    <!-- Texto IRIS (fase 1) -->
    <div id="heroText" class="heroText-visible">IRIS</div>

    <!-- Fase 2: ¿Preparado? -->
    <div id="emergingBox" class="emerging-box" aria-hidden="true">
      <img id="prepImage" src="/static/circulo.png" alt="Icono preparado" />
      <span id="prepText">¿Preparado para usar a IRIS?</span>
    </div>
  </section>

  <!-- Barra inferior -->
  <div class="bottom-bar">
    <div class="left-logo">
      <img src="/static/circulo.png" alt="Logo">
    </div>
    <button class="try-btn">
      <a href="{{ url_for('login') }}" class="btn-login">Probar ahora</a>
    </button>
  </div>

  <section class="content">
    <!-- contenido adicional -->
  </section>
</body>
</html>
