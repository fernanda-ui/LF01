<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp UI Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background-color: #111b21;
      color: #e9edef;
      display: flex;
      height: 100vh;
    }

    /* PANEL IZQUIERDO */
    .sidebar {
      width: 30%;
      background-color: #202c33;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a3942;
    }

    .sidebar-header {
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #202c33;
      border-bottom: 1px solid #2a3942;
    }

    .search-bar {
      padding: 10px;
      background-color: #111b21;
      border: none;
      width: 90%;
      margin: 10px auto;
      border-radius: 10px;
      color: #e9edef;
      outline: none;
    }

    .chats {
      flex: 1;
      overflow-y: auto;
    }

    .chat {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat:hover {
      background-color: #2a3942;
    }

    .chat img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .chat-info {
      flex: 1;
    }

    .chat-info h4 {
      font-size: 14px;
      font-weight: 600;
    }

    .chat-info p {
      font-size: 13px;
      color: #8696a0;
    }

    /* PANEL DERECHO (CHAT) */
    .chat-window {
      flex: 1;
      background-color: #0b141a;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      padding: 15px;
      background-color: #202c33;
      border-bottom: 1px solid #2a3942;
    }

    .chat-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .messages {
      flex: 1;
      background-image: url("https://i.imgur.com/Z8xWqvR.png"); /* fondo estilo WhatsApp */
      background-size: cover;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .message {
      max-width: 60%;
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .sent {
      align-self: flex-end;
      background-color: #005c4b;
      border-bottom-right-radius: 0;
    }

    .received {
      align-self: flex-start;
      background-color: #202c33;
      border-bottom-left-radius: 0;
    }

    .chat-input {
      display: flex;
      align-items: center;
      padding: 10px;
      background-color: #202c33;
      border-top: 1px solid #2a3942;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 15px;
      background-color: #2a3942;
      border: none;
      border-radius: 20px;
      color: #e9edef;
      outline: none;
    }

    .chat-input button {
      background-color: transparent;
      border: none;
      color: #8696a0;
      margin-left: 10px;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <!-- PANEL IZQUIERDO -->
  <div class="sidebar">
    <div class="sidebar-header">
      <strong>Chats</strong>
    </div>
    <input type="text" class="search-bar" placeholder="Buscar un chat o iniciar uno nuevo">
    <div class="chats">
      <div class="chat">
        <img src="https://i.imgur.com/80CEk2e.png" alt="">
        <div class="chat-info">
          <h4>SOPORTE-SMART</h4>
          <p>Tú: Ah ok</p>
        </div>
      </div>
      <div class="chat">
        <img src="https://i.imgur.com/5Y8R3Zq.png" alt="">
        <div class="chat-info">
          <h4>SmartAssets</h4>
          <p>Victor: Lo que me está diciendo alg...</p>
        </div>
      </div>
      <div class="chat">
        <img src="https://i.imgur.com/vUoJfHd.png" alt="">
        <div class="chat-info">
          <h4>Carlos G</h4>
          <p>Bien y tú</p>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div class="chat-window">
    <div class="chat-header">
      <img src="https://i.imgur.com/5Y8R3Zq.png" alt="">
      <div>
        <strong>Yo (tú)</strong><br>
        <small>Envia mensajes a este mismo número</small>
      </div>
    </div>
    <div class="messages">
      <div class="message sent">
        Quiero que seas parte del futuro con Nu 🌟
      </div>
      <div class="message sent">
        No importa en donde estés, ni la hora que sea...
      </div>
      <div class="message sent">
        Las 10 leyes Heurísticas 🧠
      </div>
    </div>
    <div class="chat-input">
      <input type="text" placeholder="Escribe un mensaje">
      <button>📎</button>
      <button>🎤</button>
    </div>
  </div>
</body>
</html>
